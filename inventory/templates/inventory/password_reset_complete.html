{% extends 'inventory/base.html' %}
{% block title %}Password updated | Inventory{% endblock %}
{% block content %}
<section class="auth-card auth-result">
    <span class="result-icon result-success">✓</span>
    <span class="auth-kicker">All set</span>
    <h1>Password updated</h1>
    <p class="auth-intro">Your password has been changed. Sign in with your new password to continue.</p>
    <a class="button button-primary button-full" href="{% url 'login' %}">Go to sign in</a>
</section>
{% endblock %}
