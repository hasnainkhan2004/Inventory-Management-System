{% extends 'inventory/base.html' %}
{% block title %}Check your email | Inventory{% endblock %}
{% block content %}
<section class="auth-card auth-result">
    <span class="result-icon">✉</span>
    <span class="auth-kicker">One more step</span>
    <h1>Check your email</h1>
    <p class="auth-intro">If an account with that email exists, password-reset instructions have been sent.</p>
    <a class="button button-secondary button-full" href="{% url 'login' %}">Back to sign in</a>
</section>
{% endblock %}
