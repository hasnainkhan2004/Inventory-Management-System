{% extends 'inventory/base.html' %}
{% block title %}Delete Product{% endblock %}
{% block content %}
<div class="modal-backdrop">
    <section class="confirmation-modal" role="alertdialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-description">
        <span class="modal-warning-icon">!</span>
        <h1 id="delete-title">Delete this product?</h1>
        <p id="delete-description">You’re about to permanently delete <strong>{{ product.name }}</strong>. This action can’t be undone.</p>
        <form method="post" class="modal-actions">
            {% csrf_token %}
            <a class="button button-secondary" href="{% url 'product_list' %}">Keep product</a>
            <button type="submit" class="button button-danger">Yes, delete</button>
        </form>
    </section>
</div>
{% endblock %}
