{% if page_obj.paginator.num_pages > 1 %}
    <nav class="pagination-bar" aria-label="Report pages">
        <span>Showing page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        <div class="pagination-controls">
            {% if page_obj.has_previous %}<a class="button button-secondary button-small" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% else %}<span class="button button-secondary button-small is-disabled">Previous</span>{% endif %}
            {% if page_obj.has_next %}<a class="button button-secondary button-small" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% else %}<span class="button button-secondary button-small is-disabled">Next</span>{% endif %}
        </div>
    </nav>
{% endif %}
